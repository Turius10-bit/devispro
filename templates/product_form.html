{% extends "layout.html" %}
{% block content %}
<div class="page-header"><div><h1 class="page-title">{{ 'Modifier le produit' if editing else 'Ajouter un produit / service' }}</h1></div></div>
<form method="post" class="card" style="max-width:640px">{{ csrf_field() }}
  <div class="card-body">
    <div class="field"><label for="name">Nom *</label><input type="text" id="name" name="name" required autofocus value="{{ product.name or '' }}"></div>
    <div class="field"><label for="description">Description</label><textarea id="description" name="description">{{ product.description or '' }}</textarea></div>
    <div class="row-3">
      <div class="field"><label for="unit_price">Prix unitaire HT ({{ CURRENCY }}) *</label><input type="number" step="0.01" min="0" id="unit_price" name="unit_price" required value="{{ product.unit_price }}"></div>
      <div class="field"><label for="unit">Unité</label><input type="text" id="unit" name="unit" value="{{ product.unit }}"></div>
      <div class="field"><label for="tva_rate">TVA (%)</label><input type="number" step="0.1" min="0" id="tva_rate" name="tva_rate" value="{{ product.tva_rate|num }}"></div>
    </div>
  </div>
  <div class="modal-footer"><a class="btn btn-secondary" href="{{ url_for('products') }}">Annuler</a>
    <button type="submit" class="btn btn-primary">{{ icon('check') }} Enregistrer</button></div>
</form>
{% endblock %}
