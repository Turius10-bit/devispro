{% extends "base.html" %}
{% block title %}Erreur {{ code }} — DevisPro{% endblock %}
{% block body %}
<div class="login-wrap"><div class="login-card">
  <div class="login-badge">{{ code }}</div>
  <h1 class="font-display">{{ {400:'Requête invalide',403:'Accès refusé',404:'Page introuvable'}.get(code,'Erreur') }}</h1>
  <p class="login-sub">{{ message }}</p>
  <a class="btn btn-primary btn-block" href="{{ url_for('dashboard') }}">Retour à l'accueil</a>
</div></div>
{% endblock %}
